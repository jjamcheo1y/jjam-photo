<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f23" media="(prefers-color-scheme: dark)">
<title>대짬철갤러리</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="diag"></div>
<script>
/* 앱이 시작도 못 하고 멈출 때를 대비한 맨 앞 진단: 오류를 화면 위에 보여 줌 */
window.__diag = function (m) { var d = document.getElementById("diag"); if (!d) return; d.textContent += (d.textContent ? "\n" : "") + m; d.classList.add("show"); };
window.addEventListener("error", function (e) { window.__diag("오류: " + e.message + " (" + String(e.filename || "").split("/").pop() + ":" + e.lineno + ")"); });
window.addEventListener("unhandledrejection", function (e) { var r = e.reason; window.__diag("약속 오류: " + ((r && r.message) || r)); });
</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c8ff"/><stop offset="1" stop-color="#6f9bea"/></linearGradient><linearGradient id="fgl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs></svg>
<div id="app">
  <header id="top">
    <div class="row main">
      <div class="tools left" role="group" aria-label="왼쪽 도구">
        <button class="ib" id="btnTree" aria-label="폴더 메뉴"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button class="ib" id="btnUp" aria-label="상위 폴더"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5M4 9h9a6 6 0 0 1 6 6v4"/></svg></button>
      </div>
      <div id="titlebox"><b id="ttl"></b><nav id="crumb"></nav></div>
      <div id="modes" role="group" aria-label="보기 방식">
        <button id="btnGrid" aria-label="일반 격자"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg></button>
        <button id="btnSplit" aria-label="분할 화면"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.2"/><path d="M4 12h16"/></svg></button>
        <button id="btnCard" aria-label="카드 모드"><svg viewBox="0 0 24 24"><rect x="6.5" y="3.5" width="11" height="14" rx="2.2"/><path d="M5 21h14"/></svg></button>
      </div>
      <div class="tools right" role="group" aria-label="오른쪽 도구">
        <button class="ib" id="btnUndo" aria-label="되돌리기" hidden><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -3)"/></svg></button>
        <button class="ib" id="btnSort" aria-label="정렬"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
        <button class="ib" id="btnTags" aria-label="태그 모아 보기"><svg viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7a1 1 0 0 1 .7.3l7.6 7.6a1 1 0 0 1 0 1.4l-7.7 7.7a1 1 0 0 1-1.4 0L3.8 12.9a1 1 0 0 1-.3-.7z"/><circle cx="8.3" cy="8.3" r="1.3"/></svg></button>
        <button class="ib" id="btnMore" aria-label="더 보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      </div>
    </div>
    <div class="row sel" id="selbar">
      <button class="ib" id="btnClear" aria-label="선택 해제"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <b id="selN">0개 선택</b>
      <span class="sp"></span>
      <button class="pill" id="btnRange">구간선택</button>
      <button class="pill" id="btnAll">전체</button>
    </div>
  </header>
  <div id="hint"></div>
  <div id="panes">
    <main id="scroll" class="pane"><div id="grid"></div><div id="empty" hidden></div></main>
    <section id="card" class="pane">
      <div class="ctop"><b id="cName"></b><span id="cPos"></span></div>
      <div class="ctags" id="cTags"></div>
      <div id="cStage"><img id="cImg" alt="" draggable="false"><div id="cEmpty"></div></div>
      <div class="cbar">
        <button class="cb" id="cPrev">‹ 이전</button>
        <button class="cb danger" id="cDel">삭제</button>
        <button class="cb" id="cMove">이동</button>
        <button class="cb" id="cOpen">갤러리</button>
        <button class="cb" id="cNext">다음 ›</button>
      </div>
      <div id="cRecent"></div>
      <div class="chint" id="cHint">위로 쓸면 삭제 · 아래로 쓸면 되돌리기 · 옆으로 넘기면 건너뛰기 · 아래 폴더를 누르면 옮기기</div>
    </section>
    <div id="mid">
      <div id="grip" aria-label="칸 크기 조절"><i></i></div>
      <footer id="actions">
        <button class="act" data-a="move">이동</button>
        <button class="act" data-a="rename">이름 바꾸기</button>
        <button class="act" data-a="tag">태그</button>
        <button class="act" data-a="color">색</button>
        <button class="act danger" data-a="trash">삭제</button>
      </footer>
    </div>
    <section id="paneB">
      <div class="bh">
        <button class="ib sm" id="bUp" aria-label="상위 폴더"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5M4 9h9a6 6 0 0 1 6 6v4"/></svg></button>
        <nav id="crumbB"></nav>
        <input id="bQ" type="search" placeholder="폴더 검색 (ㅊㅅ 같은 초성도 돼요)" autocomplete="off">
        <button class="ib sm" id="bAdd" aria-label="새 폴더"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib sm" id="bFind" aria-label="폴더 검색"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" style="fill:none;stroke:currentColor;stroke-width:2"/><path d="M16 16l4 4"/></svg></button>
        <button class="pill" id="bSort">이름순</button>
      </div>
      <div id="bHint"></div>
      <div id="bscroll" class="pane"><div id="bgrid"></div><div id="bempty"></div></div>
    </section>
  </div>
  <footer id="tactions">
    <button class="act" data-a="restore">복원</button>
    <button class="act danger" data-a="purge">영구 삭제</button>
  </footer>
</div>

<aside id="drawer"><div class="dh"><b>대짬철갤러리</b><button class="ib" data-close="drawer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="dsearch"><input id="dq" type="search" placeholder="폴더·사진·#태그 검색 (초성 가능)" autocomplete="off"></div><button class="dsp" id="dUns"><span class="dspi"><svg viewBox="0 0 24 24"><path d="M3 13l2.6-7.2A1.5 1.5 0 0 1 7 5h10a1.5 1.5 0 0 1 1.4.8L21 13v5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/><path d="M3 13h5l1.2 2.5h5.6L16 13h5"/></svg></span><span class="dspt"><b>미분류</b><small>앨범 밖에 있는 사진</small></span><span class="dspc" id="dUnsC"></span></button><div id="drawerTree"></div><div id="dres" hidden></div></aside>
<aside id="tagPanel">
  <div class="tp-head">
    <div class="tp-title"><svg viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7a1 1 0 0 1 .7.3l7.6 7.6a1 1 0 0 1 0 1.4l-7.7 7.7a1 1 0 0 1-1.4 0L3.8 12.9a1 1 0 0 1-.3-.7z"/><circle cx="8.3" cy="8.3" r="1.3"/></svg><b>태그</b><span id="tpCount"></span></div>
    <button class="ib" data-close="tagpanel" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="tp-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg><input id="tq" type="search" placeholder="태그 찾기 (초성도 돼요)" autocomplete="off"></div>
  <div class="tp-seg" id="tpSeg"><button data-tm="or" class="on">하나라도 있는</button><button data-tm="and">모두 있는</button></div>
  <button class="dsp" id="tpUns"><span class="dspi"><svg viewBox="0 0 24 24"><path d="M3 13l2.6-7.2A1.5 1.5 0 0 1 7 5h10a1.5 1.5 0 0 1 1.4.8L21 13v5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/><path d="M3 13h5l1.2 2.5h5.6L16 13h5"/></svg></span><span class="dspt"><b>미분류</b><small>앨범 밖에 있는 사진</small></span><span class="dspc" id="tpUnsC"></span></button><div id="tagList"></div>
  <div class="tp-foot"><button class="tp-clear" id="tpClear">선택 해제</button><button class="tp-go" id="tpShow">모아 보기</button></div>
</aside>
<div id="scrim"></div>

<div id="viewer" hidden>
  <div class="vtop"><button class="ib" id="vClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span id="vName"></span><span id="vPos"></span><button class="ib" id="vOpen" aria-label="갤러리에서 열기"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button></div>
  <div id="vStage"><img id="vImg" alt=""></div>
  <button class="vnav l" id="vPrev">‹</button><button class="vnav r" id="vNext">›</button>
</div>

<div id="popScrim" hidden></div>
<div id="pop" hidden></div>
<div id="sheetWrap" hidden><div id="sheet"></div></div>
<div id="perm" hidden>
  <div class="pbox">
    <h1>대짬철갤러리</h1>
    <p>폰의 사진 폴더를 그대로 보고 옮기려면<br><b>모든 파일 접근</b> 권한이 필요해요.</p>
    <button class="big" id="permBtn">설정에서 허용하기</button>
    <small>설정 화면에서 이 앱을 찾아 스위치를 켜고 돌아오면 돼요.</small>
  </div>
</div>
<div id="toast"></div>
<div id="ghost"></div>
<script src="capacitor.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
