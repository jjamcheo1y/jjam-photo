<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1f23" media="(prefers-color-scheme: dark)">
<title>대짬철갤러리</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="row main">
      <button class="ib" id="btnTree" aria-label="폴더 트리"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav id="crumb"></nav>
      <button class="ib" id="btnSort" aria-label="정렬"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
      <button class="ib" id="btnMore" aria-label="더 보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
    </div>
    <div class="row sel" id="selbar">
      <button class="ib" id="btnClear" aria-label="선택 해제"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <b id="selN">0개 선택</b>
      <span class="sp"></span>
      <button class="pill" id="btnRange">구간선택</button>
      <button class="pill" id="btnAll">전체</button>
    </div>
  </header>
  <div id="hint"></div>
  <main id="scroll"><div id="grid"></div><div id="empty" hidden></div></main>
  <footer id="actions">
    <button class="act" data-a="move">이동</button>
    <button class="act" data-a="rename">이름 바꾸기</button>
    <button class="act danger" data-a="trash">삭제</button>
  </footer>
  <footer id="tactions">
    <button class="act" data-a="restore">복원</button>
    <button class="act danger" data-a="purge">영구 삭제</button>
  </footer>
</div>

<aside id="drawer"><div class="dh"><b>대짬철갤러리</b><button class="ib" data-close="drawer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="drawerTree"></div></aside>
<div id="scrim"></div>

<div id="viewer" hidden>
  <div class="vtop"><button class="ib" id="vClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span id="vName"></span><span id="vPos"></span></div>
  <div id="vStage"><img id="vImg" alt=""></div>
  <button class="vnav l" id="vPrev">‹</button><button class="vnav r" id="vNext">›</button>
</div>

<div id="sheetWrap" hidden><div id="sheet"></div></div>
<div id="perm" hidden>
  <div class="pbox">
    <h1>대짬철갤러리</h1>
    <p>폰의 사진 폴더를 그대로 보고 옮기려면<br><b>모든 파일 접근</b> 권한이 필요해요.</p>
    <button class="big" id="permBtn">설정에서 허용하기</button>
    <small>설정 화면에서 이 앱을 찾아 스위치를 켜고 돌아오면 돼요.</small>
  </div>
</div>
<div id="toast"></div>
<div id="diag"></div>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
